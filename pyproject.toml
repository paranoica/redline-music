[project]
name = "redline"
version = "0.1.0"
description = "Measure and process the sound of a track against reference tracks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.13",
    "librosa>=1.0",
    "pyloudnorm>=0.2",
]

[project.optional-dependencies]
# audio-separator imports onnxruntime and audioread without declaring them.
separation = [
    "torch>=2.14,<2.15",
    "audio-separator>=0.47.1,<0.48",
    "onnxruntime>=1.20",
    "audioread>=3.0",
]

[project.scripts]
redline = "redline.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redline"]

# torch 2.14 cu126 is the last build with Pascal kernels (GTX 1060).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.black]
line-length = 100
# The ported code-review skill keeps its own style; it is maintained as a unit.
extend-exclude = "plugins/bedrock/skills/(code-review|design-creator|humanize)"
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "plugins/bedrock/skills/code-review",
    "plugins/bedrock/skills/design-creator",
    "plugins/bedrock/skills/humanize",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE", "C90", "D"]
ignore = ["D203", "D213"]
# Russian text is a first-class input here; its letters are not homoglyph attacks.
allowed-confusables = ["а", "в", "г", "е", "к", "м", "н", "о", "р", "с", "т", "у", "х", "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "З"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"bench/app/tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline — студия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Onest:wght@400;500;600&family=Unbounded:wght@700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/deck.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/controls.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="deck" id="deck">
    <div class="deck__bar">
      <div class="brand">
        <span class="brand__mark">REDLINE</span>
        <span class="brand__sub">студия</span>
      </div>

      <div class="transport" role="group" aria-label="Воспроизведение">
        <button class="btn btn--play" id="play" type="button" aria-label="Играть (пробел)">
          <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg class="icon icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>
        </button>
        <button class="btn btn--toggle" id="loop" type="button" aria-pressed="true" title="Петля (L)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10l-2.5-2.5M17 17H7l2.5 2.5M4 12a5 5 0 0 1 3-4.6M20 12a5 5 0 0 1-3 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Петля</span>
        </button>
        <div class="ab" role="group" aria-label="Сравнение (B)">
          <button class="ab__side" id="ab-a" type="button" aria-pressed="false">Оригинал</button>
          <button class="ab__side" id="ab-b" type="button" aria-pressed="true">Результат</button>
        </div>
        <button class="btn btn--toggle" id="blind" type="button" aria-pressed="false" title="Вслепую: названия спрятаны">Вслепую</button>
        <button class="btn btn--ghost" id="reveal" type="button" hidden>Показать, где что</button>
      </div>

      <dl class="readout">
        <div class="readout__cell">
          <dt>Позиция</dt>
          <dd class="num" id="time">00:00.0</dd>
        </div>
        <div class="readout__cell">
          <dt>Состояние</dt>
          <dd class="state" id="state" data-state="idle">загрузка</dd>
        </div>
        <div class="readout__cell">
          <dt>Рендер</dt>
          <dd class="num" id="render-ms">—</dd>
        </div>
        <div class="readout__cell">
          <dt>Строй</dt>
          <dd class="num" id="tuning">—</dd>
        </div>
        <div class="readout__cell">
          <dt>Цель мастера</dt>
          <dd class="num" id="target">—</dd>
        </div>
      </dl>

      <button class="btn btn--save" id="save" type="button" disabled>Сохранить</button>
    </div>

    <div class="wave" id="wave">
      <canvas class="wave__canvas" id="wave-canvas" aria-label="Волна трека: тяни красные края, чтобы выбрать кусок; клик — перемотка"></canvas>
      <div class="wave__legend" aria-hidden="true">
        <span class="legend legend--orig">оригинал</span>
        <span class="legend legend--res">результат</span>
        <span class="legend legend--loop" id="loop-span">петля</span>
      </div>
    </div>

    <ol class="stages" id="stages" aria-label="Этапы обработки">
      <li class="stage" data-stage="0"><span class="stage__n">1</span>Цепочка</li>
      <li class="stage" data-stage="1"><span class="stage__n">2</span>Голос</li>
      <li class="stage" data-stage="2"><span class="stage__n">3</span>Слои</li>
      <li class="stage" data-stage="3"><span class="stage__n">4</span>Бит</li>
      <li class="stage" data-stage="4"><span class="stage__n">5</span>Мастер</li>
    </ol>
  </header>

  <main class="desk">
    <section class="toolbar" aria-label="Пресеты и история">
      <div class="toolbar__group">
        <button class="btn btn--ghost" id="undo" type="button" title="Отменить (Ctrl+Z)">Отменить</button>
        <button class="btn btn--ghost" id="redo" type="button" title="Вернуть (Ctrl+Shift+Z)">Вернуть</button>
        <button class="btn btn--ghost" id="reset-all" type="button">Сбросить всё</button>
      </div>
      <div class="toolbar__group">
        <label class="field">
          <span class="field__label">Пресет</span>
          <span class="dropdown">
            <select class="dropdown__select" id="presets"><option value="">— выбрать —</option></select>
          </span>
        </label>
        <label class="field">
          <span class="field__label">Имя нового</span>
          <input class="text-input" id="preset-name" type="text" maxlength="40" placeholder="грязный припев">
        </label>
        <button class="btn btn--ghost" id="preset-save" type="button">Сохранить пресет</button>
      </div>
      <p class="toolbar__note" id="note" aria-live="polite"></p>
    </section>

    <section class="cards" id="cards" aria-label="Настройки"></section>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>
</body>
</html>

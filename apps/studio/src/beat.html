<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline — бит</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%230b0c0f'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%23ff4a3d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="beat.css">
  <script type="module" src="beat.js"></script>
</head>
<body class="beat" data-state="loading" data-playing="false">
  <p class="narrow">Редактор бита — инструмент для экрана шире 1024 пикселей. Растяни окно или открой его на компьютере.</p>

  <div class="app">
    <header class="deck bdeck">
      <div class="deck__brand">
        <span class="brand">Redline</span>
        <span class="deck__track" id="seed-name">бит · загрузка</span>
      </div>

      <div class="deck__transport" role="group" aria-label="Воспроизведение">
        <button class="play" id="play" type="button" aria-pressed="false" aria-label="Играть (пробел)">
          <svg class="play__icon play__icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
          <svg class="play__icon play__icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>
        </button>
        <button class="toggle" id="play-from" type="button" title="Играть с выбранного такта (двойной клик по такту — то же)">С такта</button>
        <button class="toggle" id="loop" type="button" aria-pressed="false" title="Крутить выбранную секцию по кругу">Петля секции</button>
        <p class="clock" aria-label="Позиция: такт и доля">
          <span class="clock__now num" id="pos">1:1</span>
          <span class="clock__total num"><span aria-hidden="true">/</span> <span id="bars">0</span> такт.</span>
        </p>
      </div>

      <div class="bdeck__facts">
        <span class="bdeck__fact num" id="tempo">— BPM</span>
        <span class="bdeck__fact" id="key">—</span>
        <div id="meter-slot"></div>
      </div>

      <div class="deck__actions">
        <button class="checkstate" id="check-state" type="button" data-state="busy" aria-live="polite">проверяю</button>
        <button class="btn btn--ghost" id="undo" type="button" title="Ctrl+Z" disabled>Отменить</button>
        <button class="btn btn--ghost" id="redo" type="button" title="Ctrl+Shift+Z" disabled>Вернуть</button>
        <button class="btn btn--line" id="render" type="button">Точный рендер</button>
        <button class="btn btn--signal" id="save" type="button" disabled>Сохранить</button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="issues" id="issues" aria-label="Проверка" tabindex="-1" hidden></section>
    <section class="render-out" id="render-out" aria-label="Точный рендер" hidden></section>

    <div id="song-slot"></div>

    <div class="work">
      <main class="work__main" id="work-main"></main>
      <div class="work__side" id="side-slot"></div>
    </div>
  </div>
</body>
</html>

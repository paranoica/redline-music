[package]
name = "redline-dsp"
description = "The heavy inner loops of redline's DSP: clipping, resampling, filters and BS.1770 loudness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "redline_dsp"
crate-type = ["cdylib", "rlib"]

[dependencies]
redline-dsp-core.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
numpy = "0.30"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "redline-dsp"
version = "0.1.0"
description = "The heavy inner loops of redline's master, in Rust"
requires-python = ">=3.12"
license = "MIT"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "redline_dsp"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "redline-dsp"
version = "0.1.0"
description = "The heavy inner loops of redline's DSP, in Rust"
requires-python = ">=3.12"
license = "MIT"

[tool.maturin]
manifest-path = "py/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "redline_dsp"

# uv rebuilds the extension when any of these change, not only when this file does
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "core/Cargo.toml" },
    { file = "core/src/**/*.rs" },
    { file = "py/Cargo.toml" },
    { file = "py/src/**/*.rs" },
]

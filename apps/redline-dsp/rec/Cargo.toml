[package]
name = "redline-rec"
description = "redline's recording engine: live monitoring through a rack over the beat, takes to WAV"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "redline_rec"

[dependencies]
redline-dsp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
jack = { version = "0.13", default-features = false, features = ["dynamic_loading"], optional = true }

[features]
# the JACK backend; without it the crate builds and tests with no audio library
jack = ["dep:jack"]

[[bin]]
name = "redline-rec"
path = "src/main.rs"
required-features = ["jack"]

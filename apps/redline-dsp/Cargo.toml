[workspace]
members = ["core", "py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
redline-dsp-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# the Faust-generated reverbs count on integers wrapping as they do in C; debug builds would
# stop on the overflow checks Rust adds
[profile.dev.package.redline-dsp-core]
overflow-checks = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
